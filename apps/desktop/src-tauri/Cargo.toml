[package]
name = "threadline"
version = "1.0.0"
description = "Open-source embroidery digitizer"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.77"

[lib]
name = "threadline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "~2.4"  # keep on the same minor as @tauri-apps/plugin-shell
tauri-plugin-dialog = "~2.8"  # keep on the same minor as @tauri-apps/plugin-dialog
tauri-plugin-updater = "~2.13"
tauri-plugin-process = "~2.4"
serde_json = "1"
