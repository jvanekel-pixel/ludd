[project]
name = "threadline-engine"
version = "1.0.1"
description = "LUDD stitch engine: JSON-RPC 2.0 sidecar over stdio"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "ezdxf>=1.4.5",
    "fonttools>=4.66.1",
    "numpy>=2.5.4",
    # AI tracing (optional). There's no ONNX Runtime for Intel Macs: LUDD runs there without it.
    "onnxruntime>=1.31.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pyembroidery>=1.5.1",
    "pypdfium2>=5.15.2",
    "shapely>=2.2.0",
    "svgelements>=1.9.6",
]

[project.scripts]
threadline-engine = "threadline_engine.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
