# Dependabot opens pull requests for updates. Nothing is merged on its own; CI runs on each one.
# Actions are pinned by commit SHA (with the version in a comment); Dependabot keeps those current.
#
# Each group holds only minor and patch updates. A major version arrives as its own pull request, so a
# big jump (TypeScript, Vite, Vitest, ...) is never mixed in with safe ones.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # 1.0 renames options release.yml uses (includeUpdaterJson), changes the update file names that the
      # latest.json job reads, and rewrites the draft release's name and text. Move to it by hand, together
      # with release.yml, and check a draft release.
      - dependency-name: tauri-apps/tauri-action
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # CI and the release build run Node 22, so keep the Node type definitions on a matching major.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /engine
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
