name: Release

# Push a tag like v1.0.0 (or run this by hand) to build installers for every system and put them
# on a DRAFT GitHub release. Check the draft, then press Publish: only then can people (and the
# in-app updater) see it. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft release first, so the four builds all upload into the same one.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v5
      - id: create
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const version = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8")).version;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              target_commitish: context.sha,
              name: `LUDD ${version}`,
              body: fs.readFileSync("docs/release-notes.md", "utf8"),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    name: ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each builds for the chip it runs on (the frozen engine must match it).
          - name: Windows
            os: windows-latest
          - name: Mac (Apple Silicon)
            os: macos-latest
          - name: Mac (Intel)
            os: macos-15-intel
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm comes from corepack in the next step, so setup-node mustn't look for it yet.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Tests
        run: |
          cd engine && uv run pytest -q && cd ..
          pnpm typecheck && pnpm test
        shell: bash

      - name: Freeze engine sidecar
        run: pnpm build:engine

      # Optional Windows code signing. Without a certificate the installer still works, but
      # Windows SmartScreen shows "Windows protected your PC" (More info > Run anyway) until the
      # app builds a reputation. Add WINDOWS_CERTIFICATE (base64 .pfx) and
      # WINDOWS_CERTIFICATE_PASSWORD as repository secrets to sign. See docs/RELEASING.md.
      - name: Windows code signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          $conf = "apps/desktop/src-tauri/tauri.conf.json"
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          $json.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $json.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue "sha256" -Force
          $json.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue "http://timestamp.digicert.com" -Force
          $json | ConvertTo-Json -Depth 20 | Set-Content $conf -Encoding utf8
          Remove-Item $pfx

      # Optional Mac signing and notarization (an Apple Developer account); see docs/RELEASING.md.
      # Only set when the secrets exist: an empty APPLE_CERTIFICATE makes the build try to sign and fail.
      - name: Mac signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$v<<LUDD_END" >> "$GITHUB_ENV"; printenv "$v" >> "$GITHUB_ENV"; echo "LUDD_END" >> "$GITHUB_ENV"
          done

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so the in-app updater only accepts genuine LUDD updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json is written once, by the job below, after every build is in.
          includeUpdaterJson: false

  # The file installed copies read to find updates: every platform's download and signature.
  updater-manifest:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const release_id = Number("${{ needs.create-release.outputs.release_id }}");
            const version = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8")).version;
            const { data: assets } = await github.rest.repos.listReleaseAssets({ owner, repo, release_id, per_page: 100 });
            const find = (re) => assets.find((a) => re.test(a.name) && !a.name.endsWith(".sig"));
            const sig = async (a) => {
              const s = assets.find((x) => x.name === `${a.name}.sig`);
              if (!s) return null;
              const r = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                owner, repo, asset_id: s.id, headers: { accept: "application/octet-stream" },
              });
              return Buffer.from(r.data).toString("utf8");
            };
            // Which file updates which system (the names Tauri's updater looks for).
            const wanted = [
              [/_x64-setup\.exe$/, ["windows-x86_64", "windows-x86_64-nsis"]],
              [/_aarch64\.app\.tar\.gz$/, ["darwin-aarch64", "darwin-aarch64-app"]],
              [/_x64\.app\.tar\.gz$/, ["darwin-x86_64", "darwin-x86_64-app"]],
              [/_amd64\.AppImage$/, ["linux-x86_64", "linux-x86_64-appimage"]],
              [/_amd64\.deb$/, ["linux-x86_64-deb"]],
            ];
            const platforms = {};
            for (const [re, keys] of wanted) {
              const a = find(re);
              const signature = a && (await sig(a));
              if (!a || !signature) { core.warning(`No signed file for ${keys[0]}`); continue; }
              for (const k of keys) platforms[k] = { url: a.browser_download_url, signature };
            }
            const manifest = { version, notes: `LUDD ${version}`, pub_date: new Date().toISOString(), platforms };
            const old = assets.find((a) => a.name === "latest.json");
            if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name: "latest.json",
              data: JSON.stringify(manifest, null, 2),
              headers: { "content-type": "application/json" },
            });
            core.info(`latest.json: ${Object.keys(platforms).join(", ")}`);
